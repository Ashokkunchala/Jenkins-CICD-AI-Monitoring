name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

# Cancel superseded runs so a push does not queue behind stale validation.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"
      - name: Check tracked secrets
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files '*.tfstate' '*.tfstate.*' '*.pem' '*.key' '*.p12' '*.pfx' '*.jks' '*.env' '.env' '*.auto.tfvars')"
          if [ -n "$tracked" ]; then
            echo "Refusing to validate: these secret-bearing files are tracked in git"
            printf '%s\n' "$tracked"
            exit 1
          fi
          echo "No secret-bearing files are tracked"
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Initialize root without backend
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate root
        run: terraform validate
      - name: Initialize simple lab without backend
        working-directory: examples/simple
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate simple lab
        working-directory: examples/simple
        run: terraform validate

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
        with:
          tflint_version: v0.53.0
      - name: Lint root module
        run: tflint --init --format compact
      - name: Lint simple lab
        working-directory: examples/simple
        # The lab reads a developer SSH public key from the local filesystem,
        # which does not exist on a clean runner. Provide an ephemeral throwaway
        # key so TFLint evaluates the real configuration unchanged.
        run: |
          ssh-keygen -q -t ed25519 -N '' -f "$HOME/.ssh/id_ed25519"
          tflint --init --format compact

  scripts:
    name: Script and Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check shell syntax
        run: find modules -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: ShellCheck
        # SC2154 is the Terraform templatefile placeholder for an unquoted shell
        # variable, and SC2034 covers the same placeholders in the template
        # source. Both are checked on the rendered output in the user_data job
        # instead, where no placeholders remain.
        run: |
          find modules -name '*.sh' -print0 \
            | xargs -0 -n1 shellcheck --severity=warning --exclude=SC2154,SC2034
      - name: Compile Python
        run: python -m compileall -q modules

  user_data:
    name: Rendered user_data validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"
      - name: Render every bootstrap script
        # Each EC2 user_data is a templatefile() call over a shell script. This
        # renders all five variants with the module defaults and checks the
        # bytes that would actually reach cloud-init, so a missed ${} escape or
        # a dropped template variable fails here instead of at boot.
        # templatefile() is used directly rather than the EC2 modules so the
        # check needs no cloud provider credentials or backend.
        run: |
          set -euo pipefail
          : "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}"
          mkdir -p rendered
          cat > rendered/main.tf <<HCL
          variable "repo_root" {
            type    = string
            default = "$GITHUB_WORKSPACE"
          }

          locals {
            maven_sha512     = "a555254d6b53d267965a3404ecb14e53c3827c09c3b94b5678835887ab404556bfaf78dcfe03ba76fa2508649dca8531c74bca4d5846513522404d48e8c4ac8b"
            gradle_sha256    = "544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d"
            go_amd64_sha256  = "8920ea521bad8f6b7bc377b4824982e011c19af27df88a815e3586ea895f1b36"
            go_arm64_sha256  = "6c33e52a5b26e7aa021b94475587fce80043a727a54ceb0eee2f9fc160646434"
            tf_amd64_sha256  = "bb1ee3e8314da76658002e2e584f2d8854b6def50b7f124e27b957a42ddacfea"
            tf_arm64_sha256  = "17b3a243ea24003a58ab324c197da8609fccae136bcb8a424bf61ec475b3a203"
            k8s_amd64_sha256 = "c6e9c45ce3f82c90663e3c30db3b27c167e8b19d83ed4048b61c1013f6a7c66e"
            k8s_arm64_sha256 = "56becf07105fbacd2b70f87f3f696cfbed226cb48d6d89ed7f65ba4acae3f2f8"
            helm_amd64_sha256 = "a5844ef2c38ef6ddf3b5a8f7d91e7e0e8ebc39a38bb3fc8013d629c1ef29c259"
            helm_arm64_sha256 = "113ccc53b7c57c2aba0cd0aa560b5500841b18b5210d78641acfddc53dac8ab2"
            nexus_sha256     = "3f7bd2e7e42706af3ffa288a1e9728a3bb33e04470a9c2625e7444299e0a7e87"
          }

          output "master" {
            value = templatefile("\${var.repo_root}/modules/jenkins-master/scripts/setup.sh", {
              jenkins_admin_user             = "admin"
              jenkins_admin_password         = ""
              jenkins_admin_secret_arn       = "arn:aws:secretsmanager:us-east-1:111122223333:secret:admin"
              jenkins_agent_secret_arn_amd64 = "arn:aws:secretsmanager:us-east-1:111122223333:secret:amd64"
              jenkins_agent_secret_arn_arm64 = "arn:aws:secretsmanager:us-east-1:111122223333:secret:arm64"
              project_name                   = "cicd-platform"
              jenkins_environment            = "dev"
              sonarqube_url                  = "http://10.0.1.10:9000"
              nexus_url                      = "http://10.0.1.11:8081"
              aws_region                     = "us-east-1"
              ai_webhook_url                 = "https://example.lambda-url.us-east-1.on.aws/"
              maven_sha512                   = local.maven_sha512
              gradle_sha256                  = local.gradle_sha256
            })
          }

          output "agent_amd64" {
            value = templatefile("\${var.repo_root}/modules/jenkins-agent/scripts/setup.sh", {
              jenkins_master_ip        = "10.0.1.10"
              jenkins_agent_name       = "cicd-platform-dev-spot-amd64"
              jenkins_agent_secret_arn = "arn:aws:secretsmanager:us-east-1:111122223333:secret:amd64"
              architecture             = "amd64"
              cpu_arch                 = "x86_64"
              go_arch                  = "amd64"
              aws_region               = "us-east-1"
              maven_sha512             = local.maven_sha512
              gradle_sha256            = local.gradle_sha256
              go_sha256                = local.go_amd64_sha256
              terraform_sha256         = local.tf_amd64_sha256
              kubectl_sha256           = local.k8s_amd64_sha256
              helm_sha256              = local.helm_amd64_sha256
            })
          }

          output "agent_arm64" {
            value = templatefile("\${var.repo_root}/modules/jenkins-agent/scripts/setup.sh", {
              jenkins_master_ip        = "10.0.1.10"
              jenkins_agent_name       = "cicd-platform-dev-spot-arm64"
              jenkins_agent_secret_arn = "arn:aws:secretsmanager:us-east-1:111122223333:secret:arm64"
              architecture             = "arm64"
              cpu_arch                 = "aarch64"
              go_arch                  = "arm64"
              aws_region               = "us-east-1"
              maven_sha512             = local.maven_sha512
              gradle_sha256            = local.gradle_sha256
              go_sha256                = local.go_arm64_sha256
              terraform_sha256         = local.tf_arm64_sha256
              kubectl_sha256           = local.k8s_arm64_sha256
              helm_sha256              = local.helm_arm64_sha256
            })
          }

          output "sonarqube" {
            value = templatefile("\${var.repo_root}/modules/sonarqube/scripts/setup.sh", {
              sonarqube_version = "10.6.0.9216"
              sonarqube_sha256  = ""
            })
          }

          output "nexus" {
            value = templatefile("\${var.repo_root}/modules/nexus/scripts/setup.sh", {
              nexus_version = "3.70.2-01"
              nexus_sha256  = local.nexus_sha256
            })
          }
          HCL
          cd rendered
          terraform init -backend=false -input=false
          terraform apply -auto-approve -input=false -no-color >/dev/null
          for name in master agent_amd64 agent_arm64 sonarqube nexus; do
            terraform output -raw "$name" > "$name.sh"
            echo "rendered $name.sh ($(wc -c < "$name.sh") bytes)"
          done
      - name: Check the rendered scripts
        run: |
          set -euo pipefail
          cd rendered
          for name in master agent_amd64 agent_arm64 sonarqube nexus; do
            bash -n "$name.sh"
            echo "bash -n OK  $name.sh"
          done
          # The rendered scripts are clean at the strictest severity, and the
          # template placeholders are gone, so this needs no exclusions and
          # catches style-level issues such as unquoted expansions too.
          shellcheck --severity=style ./*.sh
          if grep -n '\$\$' ./*.sh; then
            echo "Unescaped Terraform interpolation leaked into user_data"
            exit 1
          fi
      - name: Assert the pinned toolchain reached user_data
        # Guards against a pin being dropped or an interpolation silently
        # expanding to an empty string.
        run: |
          set -euo pipefail
          grep -q 'nodesource-nodejs.repo' rendered/master.sh
          grep -q 'MVN_SHA512="[0-9a-f]\{128\}"' rendered/master.sh
          grep -q 'GRADLE_SHA256="[0-9a-f]\{64\}"' rendered/master.sh
          grep -q 'verify_sha256' rendered/nexus.sh
          grep -q 'SONARQUBE_URL' rendered/master.sh
          echo "user_data toolchain pins verified"
      - name: Assert the harness pins still match the module defaults
        # The rendered harness repeats the pin values so it needs no provider
        # credentials. If a default in a module variables.tf changes, the
        # harness value stops appearing there and this fails.
        run: |
          set -euo pipefail
          for pin in \
            a555254d6b53d267965a3404ecb14e53c3827c09c3b94b5678835887ab404556bfaf78dcfe03ba76fa2508649dca8531c74bca4d5846513522404d48e8c4ac8b \
            544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d \
            bb1ee3e8314da76658002e2e584f2d8854b6def50b7f124e27b957a42ddacfea \
            17b3a243ea24003a58ab324c197da8609fccae136bcb8a424bf61ec475b3a203 \
            a5844ef2c38ef6ddf3b5a8f7d91e7e0e8ebc39a38bb3fc8013d629c1ef29c259 \
            113ccc53b7c57c2aba0cd0aa560b5500841b18b5210d78641acfddc53dac8ab2 \
            3f7bd2e7e42706af3ffa288a1e9728a3bb33e04470a9c2625e7444299e0a7e87
          do
            if ! grep -rq "$pin" modules; then
              echo "Pinned digest $pin is no longer the default in any module"
              exit 1
            fi
          done
          echo "harness pins match module defaults"

  checkov:
    name: Checkov IaC and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Checkov
        run: pip install --disable-pip-version-check "checkov==3.3.19"
      - name: Terraform policy scan
        # The documented rationale for every suppressed check lives in
        # .checkov.yml. Removing an entry there fails this step.
        run: checkov -d . --framework terraform --compact
      - name: Secret scan
        # Checkov's default file-type list omits shell, Groovy, and dotenv
        # files, all of which exist in this repository.
        run: checkov -d . --framework secrets --enable-secret-scan-all-files --compact
